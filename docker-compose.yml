version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: labvita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labvita
      POSTGRES_USER: labvita
      POSTGRES_PASSWORD: labvita_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labvita"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: labvita_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://labvita:labvita_secret@postgres:5432/labvita
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data: