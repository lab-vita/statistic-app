<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName docs.lab-vita.ru
    DocumentRoot /var/www/html

    SSLCertificateFile /etc/letsencrypt/live/docs.lab-vita.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/docs.lab-vita.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"

    # Разрешаем показ в iframe только на портале Битрикс24
    Header always unset X-Frame-Options
    Header always set Content-Security-Policy "frame-ancestors 'self' https://mfk-sfera.bitrix24.ru"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    # Закрыть служебные пути
    RedirectMatch 404 /\.git

    # Доступ к данным проверяет само приложение (вход через Битрикс24).
    # Без токена API отвечает 401, а прямой заход на /bitrix/handler показывает «Доступ ограничен».

    # Порядок важен: сначала более специфичные пути
    ProxyPass        /api/    http://127.0.0.1:8100/api/
    ProxyPassReverse /api/    http://127.0.0.1:8100/api/
    ProxyPass        /bitrix/ http://127.0.0.1:8100/bitrix/
    ProxyPassReverse /bitrix/ http://127.0.0.1:8100/bitrix/
    ProxyPass        /        http://127.0.0.1:3100/
    ProxyPassReverse /        http://127.0.0.1:3100/
</VirtualHost>
</IfModule>
