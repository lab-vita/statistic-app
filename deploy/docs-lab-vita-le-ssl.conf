<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName docs.lab-vita.ru
    DocumentRoot /var/www/html

    SSLCertificateFile /etc/letsencrypt/live/docs.lab-vita.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/docs.lab-vita.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"

    # Разрешаем показ в iframe только на портале Битрикс24 (замени ПОРТАЛ)
    Header always unset X-Frame-Options
    Header always set Content-Security-Policy "frame-ancestors 'self' https://ПОРТАЛ.bitrix24.ru"

    # Закрыть служебные пути
    RedirectMatch 404 /\.git

    # ---- ВРЕМЕННАЯ защита, пока нет авторизации Битрикс24 (этап 5) ----
    # Создать пароль: sudo htpasswd -c /etc/apache2/.htpasswd-stats admin
    # На этапе 5 этот блок удаляется.
    <Location />
        AuthType Basic
        AuthName "Labvita Stats"
        AuthUserFile /etc/apache2/.htpasswd-stats
        Require valid-user
    </Location>

    # Порядок важен: сначала более специфичные пути
    ProxyPass        /api/    http://127.0.0.1:8100/api/
    ProxyPassReverse /api/    http://127.0.0.1:8100/api/
    ProxyPass        /bitrix/ http://127.0.0.1:8100/bitrix/
    ProxyPassReverse /bitrix/ http://127.0.0.1:8100/bitrix/
    ProxyPass        /        http://127.0.0.1:3100/
    ProxyPassReverse /        http://127.0.0.1:3100/
</VirtualHost>
</IfModule>
